<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>status.vyoh.gg</title>
	<link rel="icon" id="favicon" href="data:,">
	<style>
		:root {
			color-scheme: light dark;
			--fg: light-dark(#0f172a, #f1f5f9);
			--muted: light-dark(#64748b, #94a3b8);
			--bg: light-dark(#f8fafc, #0b1120);
			--card: light-dark(#ffffff, #0f172a);
			--rule: light-dark(#e2e8f0, #1e293b);
			--up-bg: light-dark(#ecfdf5, #052e1a);
			--up-fg: light-dark(#047857, #6ee7b7);
			--up-dot: #10b981;
			--down-bg: light-dark(#fef2f2, #3b0a0a);
			--down-fg: light-dark(#b91c1c, #fca5a5);
			--down-dot: #ef4444;
			--warn-bg: light-dark(#fffbeb, #3a2a06);
			--warn-fg: light-dark(#92400e, #fcd34d);
			--warn-dot: #f59e0b;
			--idle-bg: light-dark(#f1f5f9, #1e293b);
			--idle-fg: var(--muted);
			--idle-dot: #94a3b8;
		}
		* { box-sizing: border-box; }
		html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
		body {
			font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, sans-serif;
			max-width: 48rem;
			margin: 0 auto;
			padding: 3rem 1.25rem 4rem;
		}

		header { margin-bottom: 2rem; }
		.wordmark {
			font: 600 1.125rem/1.2 ui-sans-serif, system-ui, sans-serif;
			letter-spacing: -0.01em;
			margin: 0 0 0.25rem;
		}
		.wordmark .dot {
			color: var(--muted);
			font-weight: 400;
		}

		.banner {
			display: flex;
			align-items: center;
			gap: 0.9rem;
			padding: 1rem 1.25rem;
			border-radius: 10px;
			margin-bottom: 2rem;
			background: var(--idle-bg);
			color: var(--idle-fg);
			border: 1px solid transparent;
		}
		.banner[data-state="up"] { background: var(--up-bg); color: var(--up-fg); }
		.banner[data-state="down"] { background: var(--down-bg); color: var(--down-fg); }
		.banner[data-state="degraded"] { background: var(--warn-bg); color: var(--warn-fg); }
		.banner-icon {
			width: 1.5rem;
			height: 1.5rem;
			flex-shrink: 0;
			display: grid;
			place-items: center;
		}
		.banner-text { flex: 1; }
		.banner-text strong { display: block; font-weight: 600; font-size: 1rem; letter-spacing: -0.005em; }
		.banner-text span { display: block; font-size: 0.825rem; opacity: 0.75; margin-top: 2px; }

		.stale {
			background: var(--warn-bg);
			color: var(--warn-fg);
			padding: 0.75rem 1rem;
			border-radius: 8px;
			font-size: 0.85rem;
			margin-bottom: 1.5rem;
		}
		.stale[hidden] { display: none; }

		.group { margin-bottom: 1.75rem; }
		.group h2 {
			font: 600 0.72rem/1 ui-sans-serif, system-ui, sans-serif;
			text-transform: uppercase;
			letter-spacing: 0.09em;
			color: var(--muted);
			margin: 0 0 0.6rem;
			padding-left: 0.25rem;
		}
		.group-list {
			list-style: none;
			padding: 0;
			margin: 0;
			background: var(--card);
			border: 1px solid var(--rule);
			border-radius: 10px;
			overflow: hidden;
		}
		.row {
			display: flex;
			align-items: flex-start;
			gap: 0.9rem;
			padding: 0.85rem 1rem;
			border-bottom: 1px solid var(--rule);
		}
		.row:last-child { border-bottom: 0; }
		.row .dot {
			width: 0.55rem;
			height: 0.55rem;
			border-radius: 50%;
			flex-shrink: 0;
			background: var(--idle-dot);
			margin-top: 0.4rem;
		}
		.row[data-state="up"] .dot { background: var(--up-dot); }
		.row[data-state="down"] .dot { background: var(--down-dot); }
		.row .main {
			flex: 1;
			min-width: 0;
			display: flex;
			flex-direction: column;
			gap: 0.5rem;
		}
		.row .host {
			font: 500 0.9rem/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
			color: var(--fg);
			word-break: break-all;
		}
		.history {
			display: grid;
			grid-template-columns: repeat(288, 1fr);
			gap: 0;
			height: 16px;
			width: 100%;
			border-radius: 2px;
			overflow: hidden;
		}
		.h-bar {
			background: var(--idle-dot);
			opacity: 0.25;
			min-width: 0;
			transition: opacity 0.15s;
		}
		.h-bar[data-state="up"] { background: var(--up-dot); opacity: 0.75; }
		.h-bar[data-state="down"] { background: var(--down-dot); opacity: 1; }
		.h-bar:last-child[data-state="up"] { opacity: 1; }
		.h-bar:hover { opacity: 1; outline: 1px solid var(--fg); }
		.history-caption {
			display: flex;
			justify-content: space-between;
			font-size: 0.68rem;
			color: var(--muted);
			margin-top: 0.3rem;
			letter-spacing: 0.02em;
		}
		.row .pill {
			margin-top: 0.1rem;
			flex-shrink: 0;
			display: inline-flex;
			align-items: center;
			gap: 0.4rem;
			padding: 0.2rem 0.55rem;
			border-radius: 999px;
			font: 600 0.7rem/1 ui-sans-serif, system-ui, sans-serif;
			text-transform: uppercase;
			letter-spacing: 0.06em;
			flex-shrink: 0;
		}
		.row[data-state="up"] .pill { background: var(--up-bg); color: var(--up-fg); }
		.row[data-state="down"] .pill { background: var(--down-bg); color: var(--down-fg); }
		.row .code { font-variant-numeric: tabular-nums; opacity: 0.7; }

		footer {
			margin-top: 3rem;
			padding-top: 1rem;
			border-top: 1px solid var(--rule);
			color: var(--muted);
			font-size: 0.8rem;
			display: flex;
			justify-content: space-between;
			gap: 1rem;
			flex-wrap: wrap;
		}
		footer a { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; }
		footer a:hover { color: var(--fg); }

		.empty { color: var(--muted); font-style: italic; padding: 1rem; }
	</style>
</head>
<body>
	<header>
		<h1 class="wordmark">status<span class="dot">.</span>vyoh<span class="dot">.</span>gg</h1>
	</header>

	<div class="banner" id="banner" data-state="idle">
		<div class="banner-icon" id="banner-icon"></div>
		<div class="banner-text">
			<strong id="banner-headline">Loading…</strong>
			<span id="banner-sub"></span>
		</div>
	</div>

	<div class="stale" id="stale-banner" hidden>
		Monitoring looks late — last check was <span id="stale-age"></span>. The prober itself may be delayed.
	</div>

	<main id="groups"></main>

	<footer>
		<span>Probed from GitHub Actions every ~5 min.</span>
		<a href="https://github.com/sergeantjonas/status.vyoh.gg">github.com/sergeantjonas/status.vyoh.gg</a>
	</footer>

	<script>
		const STALE_MINUTES = 20;
		const HISTORY_ENTRIES = 288;
		const GROUP_ORDER = ['critical', 'bytesized'];
		const GROUP_LABEL = {
			critical: 'Critical',
			bytesized: 'Self-hosted',
			other: 'Other',
		};

		const ICONS = {
			up: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>`,
			degraded: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/></svg>`,
			down: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6"/><path d="M9 9l6 6"/></svg>`,
			idle: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l2 2"/></svg>`,
		};

		const FAVICON_COLOR = { up: '#10b981', degraded: '#f59e0b', down: '#ef4444', idle: '#94a3b8' };

		function fmtAge(seconds) {
			if (seconds < 60) return 'just now';
			const m = Math.round(seconds / 60);
			if (m < 60) return `${m} min ago`;
			const h = Math.round(m / 60);
			if (h < 24) return `${h} hr ago`;
			return `${Math.round(h / 24)} d ago`;
		}

		function setFavicon(state) {
			const color = FAVICON_COLOR[state] || FAVICON_COLOR.idle;
			const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12" fill="${color}"/></svg>`;
			document.getElementById('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(svg);
		}

		function overallState(targets) {
			if (!targets || targets.length === 0) return 'idle';
			const down = targets.filter(t => t.state === 'down').length;
			if (down === 0) return 'up';
			if (down === targets.length) return 'down';
			return 'degraded';
		}

		function headlineFor(state, targets) {
			const down = targets.filter(t => t.state === 'down').length;
			const total = targets.length;
			if (state === 'up') return 'All systems operational';
			if (state === 'down') return `All ${total} services down`;
			if (state === 'degraded') return `${down} of ${total} services down`;
			return 'No data yet';
		}

		function renderHistory(history) {
			// history is a list of [unix_ts, state] pairs, oldest first,
			// up to HISTORY_ENTRIES entries. Older entries scroll off the left.
			// Pad the left with empty "no data" bars so the strip stays
			// fixed-width even when a target is new.
			const strip = document.createElement('div');
			strip.className = 'history';

			const timeFmt = new Intl.DateTimeFormat(undefined, {
				hour: '2-digit', minute: '2-digit',
			});
			const fullFmt = new Intl.DateTimeFormat(undefined, {
				month: 'short', day: 'numeric',
				hour: '2-digit', minute: '2-digit',
			});

			const padCount = HISTORY_ENTRIES - history.length;
			const bars = [];
			for (let i = 0; i < padCount; i++) {
				const bar = document.createElement('span');
				bar.className = 'h-bar';
				bar.title = 'no data yet';
				bars.push(bar);
			}
			for (const [ts, state] of history) {
				const bar = document.createElement('span');
				bar.className = 'h-bar';
				bar.dataset.state = state;
				bar.title = `${fullFmt.format(new Date(ts * 1000))} · ${state}`;
				bars.push(bar);
			}
			strip.append(...bars);
			return strip;
		}

		function render(data) {
			const now = Math.floor(Date.now() / 1000);
			const targets = data.targets || [];
			const state = overallState(targets);
			const age = data.generated_at ? now - data.generated_at : null;

			const banner = document.getElementById('banner');
			banner.dataset.state = state;
			document.getElementById('banner-icon').innerHTML = ICONS[state];
			document.getElementById('banner-headline').textContent = headlineFor(state, targets);
			document.getElementById('banner-sub').textContent =
				age !== null ? `Checked ${fmtAge(age)}` : 'Waiting for first probe.';

			setFavicon(state);

			const stale = age !== null && age > STALE_MINUTES * 60;
			const staleBanner = document.getElementById('stale-banner');
			staleBanner.hidden = !stale;
			if (stale) document.getElementById('stale-age').textContent = fmtAge(age);

			const groups = {};
			for (const t of targets) {
				(groups[t.group || 'other'] ||= []).push(t);
			}

			const container = document.getElementById('groups');
			container.innerHTML = '';

			if (targets.length === 0) {
				const p = document.createElement('p');
				p.className = 'empty';
				p.textContent = 'No targets configured yet.';
				container.appendChild(p);
				return;
			}

			const seen = new Set();
			const ordered = [
				...GROUP_ORDER.filter(g => groups[g]),
				...Object.keys(groups).filter(g => !GROUP_ORDER.includes(g)).sort(),
			].filter(g => { if (seen.has(g)) return false; seen.add(g); return true; });

			for (const name of ordered) {
				const section = document.createElement('section');
				section.className = 'group';
				const h = document.createElement('h2');
				h.textContent = GROUP_LABEL[name] || name;
				section.appendChild(h);
				const ul = document.createElement('ul');
				ul.className = 'group-list';
				for (const t of groups[name]) {
					const li = document.createElement('li');
					li.className = 'row';
					li.dataset.state = t.state;

					const dot = document.createElement('span');
					dot.className = 'dot';

					const main = document.createElement('div');
					main.className = 'main';

					const host = document.createElement('span');
					host.className = 'host';
					host.textContent = t.host + (t.path && t.path !== '/' ? t.path : '');
					main.appendChild(host);
					main.appendChild(renderHistory(t.history || []));

					const pill = document.createElement('span');
					pill.className = 'pill';
					if (t.state === 'down') {
						const label = document.createTextNode('Down');
						const code = document.createElement('span');
						code.className = 'code';
						code.textContent = t.code ? ` · ${t.code}` : (t.error ? ' · timeout' : '');
						pill.append(label, code);
					} else {
						pill.textContent = 'Up';
					}

					li.append(dot, main, pill);
					ul.appendChild(li);
				}
				section.appendChild(ul);
				container.appendChild(section);
			}
		}

		async function load() {
			try {
				const r = await fetch('./status.json', { cache: 'no-store' });
				render(await r.json());
			} catch (e) {
				const banner = document.getElementById('banner');
				banner.dataset.state = 'idle';
				document.getElementById('banner-icon').innerHTML = ICONS.idle;
				document.getElementById('banner-headline').textContent = 'Status unavailable';
				document.getElementById('banner-sub').textContent = 'Could not load status.json.';
				setFavicon('idle');
			}
		}

		load();
		setInterval(load, 60_000);
	</script>
</body>
</html>
