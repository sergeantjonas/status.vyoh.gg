name: probe

on:
  schedule:
    # Hourly backup only. The 15-minute cadence comes from the Cloudflare
    # Worker in worker/ calling workflow_dispatch, because scheduled runs on
    # public free-tier repos are routinely delayed or dropped under load.
    # Off the hour because GitHub sheds load hardest at the top of it.
    - cron: '37 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Retried because the fallback resets every host's alert state, which
      # loses the recovery alert for any outage in progress.
      - name: Fetch previous status.json
        run: |
          curl -fsS --retry 3 --retry-all-errors -o status.json https://status.vyoh.gg/status.json \
            || echo '{"generated_at":0,"targets":[]}' > status.json

      - name: Probe
        env:
          NOTIFY_HUB_URL: ${{ secrets.NOTIFY_HUB_URL }}
          NOTIFY_HUB_SECRET: ${{ secrets.NOTIFY_HUB_SECRET }}
        run: python probe.py

      # Deploy even if the Probe step failed delivery to notify-hub, so the
      # page always reflects the latest probe result. The job's overall status
      # stays "failed" when probe.py exits 1, which triggers the workflow-
      # failure email that doubles as the box-down alert.
      - name: Assemble site
        if: ${{ !cancelled() }}
        run: |
          mkdir -p _site
          cp index.html status.json CNAME _site/
          cp -r fonts _site/

      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: _site

      - id: deploy
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4
