# Prober input. Each run of .github/workflows/probe.yml iterates these
# blocks and writes status.json. Edit to add or remove monitored sites.
#
# Fields per [[target]]:
#   host     (required) — public hostname, probed over HTTPS.
#   path     (default: "/") — URL path.
#   expected (default: [200, 301, 302]) — acceptable response codes.
#   group    (default: "other") — display grouping on the status page.

[[target]]
host = "vyoh.gg"
group = "critical"

[[target]]
host = "api.vyoh.gg"
path = "/health"
group = "critical"

[[target]]
host = "engram.vyoh.gg"
group = "critical"

[[target]]
host = "api.engram.vyoh.gg"
path = "/ready"
group = "critical"

[[target]]
host = "www.vyoh.gg"
group = "critical"

# Bytesized reverse-proxied stack. The auth gateway in front of each service
# answers 302 (redirect to login), so the default expected codes cover them —
# no per-service health path is needed. The probe tests the netcup → bytesized
# reverse-proxy path end-to-end.

[[target]]
host = "plex.vyoh.gg"
group = "bytesized"

[[target]]
host = "sonarr.vyoh.gg"
group = "bytesized"

[[target]]
host = "radarr.vyoh.gg"
group = "bytesized"

[[target]]
host = "bazarr.vyoh.gg"
group = "bytesized"

# hydra and nzb sit behind nginx IP-restricted basic auth, so a probe from a
# GitHub runner's IP returns 401 instead of the 302 you'd see from a whitelisted
# IP. The 401 proves the service is reachable and the auth gate is up — a truly
# dead upstream would 502 or time out — so accept it as valid.
[[target]]
host = "hydra.vyoh.gg"
expected = [200, 301, 302, 401]
group = "bytesized"

[[target]]
host = "nzb.vyoh.gg"
expected = [200, 301, 302, 401]
group = "bytesized"

[[target]]
host = "deluge.vyoh.gg"
group = "bytesized"

[[target]]
host = "tautulli.vyoh.gg"
group = "bytesized"

[[target]]
host = "files.vyoh.gg"
group = "bytesized"

# notify.vyoh.gg is not here yet — the nginx vhost exists but the hub itself
# answers 404 for now (nothing bound upstream). Add it once the hub is live
# and the `/` route returns 200.
